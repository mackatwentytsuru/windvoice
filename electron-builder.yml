appId: com.macka.windvoice
productName: WindVoice
directories:
  output: release/${version}
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - "**/*.{node,dll}"

# ─── Windows ────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: WindVoice-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  shortcutName: WindVoice
  createDesktopShortcut: true

# ─── macOS ──────────────────────────────────────────────────────────────────
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: resources/icon.png
  artifactName: WindVoice-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing/notarizing is OFF by default; set CSC_LINK + APPLE_ID env vars
  # at build time to enable. Without signing, users must right-click → Open
  # the first time on macOS.
  identity: null
dmg:
  artifactName: WindVoice-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ─── Auto-update ────────────────────────────────────────────────────────────
publish:
  provider: github
  owner: mackatwentytsuru
  repo: windvoice
  releaseType: release
