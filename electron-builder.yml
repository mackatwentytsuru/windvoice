# NOTE on Gatekeeper: the macOS DMG produced by this config is UNSIGNED
# (identity: null, see below). On first launch users must right-click the app
# and choose "Open", or run `xattr -cr /Applications/WindVoice.app` to
# strip the quarantine attribute. To ship a signed/notarized build, set
# CSC_LINK + CSC_KEY_PASSWORD + APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD +
# APPLE_TEAM_ID env vars at build time and remove `identity: null`.
appId: com.macka.windvoice
productName: WindVoice
directories:
  output: release/${version}
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  # Native modules (.node) and Windows-only DLLs already need to be unpacked
  # so the OS loader can find them on disk. Also unpack macOS dylibs and
  # Linux shared objects (.dylib / .so) — koffi / loudness / sendinput
  # bundle these on those platforms and the dlopen path requires a real
  # on-disk file rather than an asar-archived blob.
  - "**/*.{node,dll,dylib,so}"
  # Spawnable child process — must live on disk, not inside the asar archive.
  - "resources/native/**"

# ─── Windows ────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  # Point at the 1024×1024 PNG (no .ico is committed). electron-builder
  # auto-generates a multi-resolution .ico from it for the exe + installer.
  icon: resources/icon.png
  artifactName: WindVoice-Setup-${version}-${arch}.${ext}
  # Skip signtool/osslsigncode altogether — we don't sign personal builds.
  signtoolOptions: null
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  shortcutName: WindVoice
  createDesktopShortcut: true
# Disable signing entirely (no cert) — also skips winCodeSign download which
# fails on Windows without Developer Mode (cannot create symlinks for the
# embedded macOS signing tools).
forceCodeSigning: false

# ─── macOS ──────────────────────────────────────────────────────────────────
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: resources/icon.png
  artifactName: WindVoice-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Sign with the stable Apple Development identity from the local Keychain.
  # A stable identity is what keeps macOS TCC grants (Accessibility / Input
  # Monitoring / Microphone) valid across rebuilds — ad-hoc signing changes
  # the cdhash every build and silently revokes them. For public distribution
  # swap this for a "Developer ID Application" cert + notarization
  # (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID env vars).
  # On machines without this cert, override with CSC_IDENTITY_AUTO_DISCOVERY
  # =false or edit back to `identity: null`.
  identity: "Apple Development: Yuki Tsuruoka (ZFDPLA8275)"
  extendInfo:
    NSMicrophoneUsageDescription: "WindVoice uses your microphone to transcribe speech via the OpenAI Realtime API."
    NSAppleEventsUsageDescription: "WindVoice uses Apple Events (osascript) to temporarily lower system output volume while you dictate. This is opt-in on macOS."
dmg:
  artifactName: WindVoice-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ─── Auto-update ────────────────────────────────────────────────────────────
publish:
  provider: github
  owner: mackatwentytsuru
  repo: windvoice
  releaseType: release
